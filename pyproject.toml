[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ssj"
version = "0.1.0"
description = "Simultaneous Saturated Jacobi eigensolver for symmetric/Hermitian matrices"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
cholqr2 = ["scipy>=1.8"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
